<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Préstamos - Pañol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container-fluid px-5 my-5">
        <a href="/" class="btn btn-outline-secondary mb-3">⬅️ Volver al Menú Principal</a>

        <h1 class="text-center mb-4">📋 Control de Préstamos y Devoluciones</h1>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <ul class="nav nav-pills" id="prestamosTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="activos-tab" data-bs-toggle="tab" data-bs-target="#activos" type="button" role="tab" onclick="cargarPrestamosActivos()">⚠️ En uso (Activos)</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="historial-tab" data-bs-toggle="tab" data-bs-target="#historial" type="button" role="tab" onclick="cargarHistorial()">📜 Historial Completo</button>
                </li>
            </ul>

            <button type="button" class="btn btn-warning fw-bold text-dark" data-bs-toggle="modal" data-bs-target="#modalPrestamo" onclick="prepararFormulario()">
                ➕ Registrar Nuevo Préstamo
            </button>
        </div>

        <div class="tab-content" id="prestamosTabsContent">
            
            <div class="tab-pane fade show active" id="activos" role="tabpanel" aria-labelledby="activos-tab">
                <div class="card shadow-sm">
                    <div class="card-body p-0">
                        <table class="table table-striped table-hover mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>Fecha Salida</th>
                                    <th>Docente</th>
                                    <th>Elemento</th>
                                    <th>Categoría</th>
                                    <th>Observaciones</th>
                                    <th class="text-center">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-activos">
                                <tr><td colspan="6" class="text-center py-4">Cargando préstamos activos...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="historial" role="tabpanel" aria-labelledby="historial-tab">
                <div class="card shadow-sm">
                    <div class="card-body p-0">
                        <table class="table table-striped table-hover mb-0">
                            <thead class="table-secondary">
                                <tr>
                                    <th>Fecha Salida</th>
                                    <th>Fecha Devolución</th>
                                    <th>Docente</th>
                                    <th>Elemento</th>
                                    <th>Estado</th>
                                    <th>Observaciones</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-historial">
                                <tr><td colspan="6" class="text-center py-4">Cargando historial...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="modal fade" id="modalPrestamo" tabindex="-1" aria-labelledby="modalPrestamoLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-warning text-dark">
                    <h5 class="modal-title fw-bold" id="modalPrestamoLabel">Registrar Salida de Material</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="form-prestamo">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="select-docente" class="form-label">Docente que retira</label>
                            <select id="select-docente" class="form-select" required>
                                <option value="" selected disabled>Cargando profesores...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="select-elemento" class="form-label">Elemento a prestar</label>
                            <select id="select-elemento" class="form-select" required>
                                <option value="" selected disabled>Cargando stock disponible...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="observaciones" class="form-label">Observaciones (Opcional)</label>
                            <textarea id="observaciones" class="form-control" rows="2" placeholder="Ej: Se lleva sin control remoto, falta cable HDMI..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-warning fw-bold">Confirmar Préstamo</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_URL = 'http://localhost:3000/api/prestamos';

        // 1. CARGAR PRÉSTAMOS ACTIVOS (LO QUE ESTÁ AFUERA)
        async function cargarPrestamosActivos() {
            const tabla = document.getElementById('tabla-activos');
            try {
                const res = await fetch(`${API_URL}/activos`);
                const datos = await res.json();
                tabla.innerHTML = '';

                if (datos.length === 0) {
                    tabla.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">No hay ningún elemento afuera. Todo está en el pañol.</td></tr>`;
                    return;
                }

                datos.forEach(p => {
                    const fecha = new Date(p.fechayhora_salida).toLocaleString('es-AR');
                    tabla.innerHTML += `
                        <tr>
                            <td>${fecha}</td>
                            <td><strong>${p.docente_apellido}, ${p.docente_nombre}</strong></td>
                            <td>${p.elemento_nombre}</td>
                            <td><span class="badge bg-secondary">${p.elemento_categoria}</span></td>
                            <td class="text-muted"><em>${p.observaciones || '-'}</em></td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-success fw-bold" onclick="devolverObjeto(${p.id}, ${p.id_elementos})">
                                    ✓ Recibir Devolución
                                </button>
                            </td>
                        </tr>
                    `
                });
            } catch (err) {
                console.error(err);
                tabla.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">Error al conectar con la API.</td></tr>`;
            }
        }

        // 2. CARGAR EL HISTORIAL COMPLETO
        async function cargarHistorial() {
            const tabla = document.getElementById('tabla-historial');
            try {
                const res = await fetch(`${API_URL}/prestamos/historial`);
                const datos = await res.json();
                tabla.innerHTML = '';

                if (datos.length === 0) {
                    tabla.innerHTML = `<tr><td colspan="6" class="text-center py-4">No hay registros en el historial todavía.</td></tr>`;
                    return;
                }

                datos.forEach(p => {
                    const fSalida = new Date(p.fechayhora_salida).toLocaleString('es-AR');
                    const fDevolucion = p.fechayhora_devolucion ? new Date(p.fechayhora_devolucion).toLocaleString('es-AR') : '<span class="text-danger fw-bold">No devuelto</span>';
                    const badge = p.estado === 'Activo' ? 'bg-warning text-dark' : 'bg-success';

                    tabla.innerHTML += `
                        <tr>
                            <td>${fSalida}</td>
                            <td>${fDevolucion}</td>
                            <td>${p.docente_apellido}, ${p.docente_nombre}</td>
                            <td><strong>${p.elemento_nombre}</strong></td>
                            <td><span class="badge ${badge}">${p.estado}</span></td>
                            <td class="text-muted"><small>${p.observaciones || '-'}</small></td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error(err);
                tabla.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">Error al cargar historial.</td></tr>`;
            }
        }

        // 3. PREPARAR EL MODAL TRAENDO LOS COMPONENTES DE LAS OTRAS TABLAS (DOCENTES Y ELEMENTOS)
        async function prepararFormulario() {
            const selectDocente = document.getElementById('select-docente');
            const selectElemento = document.getElementById('select-elemento');

            try {
                // Traer Docentes
                const resDoc = await fetch(`http://localhost:3000/api/docentes`);
                const docentes = await resDoc.json();
                selectDocente.innerHTML = '<option value="" selected disabled>Seleccioná el docente...</option>';
                docentes.forEach(d => {
                    selectDocente.innerHTML += `<option value="${d.id}">${d.apellido}, ${d.nombre}, (DNI: ${d.dni}) ${d.turno}</option>`;
                });

                // Traer Elementos
                const resElem = await fetch(`http://localhost:3000/api/elementos`);
                const elementos = await resElem.json();
                selectElemento.innerHTML = '<option value="" selected disabled>Seleccioná el objeto...</option>';
                
                // IMPORTANTE: Solo dejamos seleccionar elementos cuyo estado sea 'Disponible'
                elementos.forEach(e => {
                    if (e.estado === 'Disponible') {
                        selectElemento.innerHTML += `<option value="${e.id}">${e.nombre} (${e.categoria})</option>`;
                    }
                });
            } catch (err) {
                console.error(err);
                alert('Error al cargar la lista de docentes o elementos.');
            }
        }

        // 4. ACCIÓN DE CREAR EL PRÉSTAMO (POST)
        document.getElementById('form-prestamo').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id_docentes = document.getElementById('select-docente').value;
            const id_elementos = document.getElementById('select-elemento').value;
            const observaciones = document.getElementById('observaciones').value;

            try {
                const res = await fetch(`http://localhost:3000/api/prestamos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_docentes, id_elementos, observaciones })
                });

                if (res.ok) {
                    alert('¡Préstamo registrado exitosamente!');
                    document.getElementById('form-prestamo').reset();
                    bootstrap.Modal.getInstance(document.getElementById('modalPrestamo')).hide();
                    cargarPrestamosActivos(); // Recargamos la grilla
                } else {
                    const errData = await res.json();
                    alert('Error: ' + errData.message);
                }
            } catch (err) {
                console.error(err);
                alert('No se pudo conectar con el servidor.');
            }
        });

        // 5. ACCIÓN DE RECIBIR LA DEVOLUCIÓN (PUT)
        async function devolverObjeto(prestamoId, elementoId) {
            if (!confirm('¿Confirmás que el docente devolvió el elemento en buen estado?')) return;

            try {
                const res = await fetch(`http://localhost:3000/api/prestamos/${prestamoId}/devolucion`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_elementos: elementoId })
                });

                if (res.ok) {
                    alert('¡Devolución asentada! El objeto vuelve a estar disponible.');
                    cargarPrestamosActivos();
                } else {
                    alert('No se pudo procesar la devolución.');
                }
            } catch (err) {
                console.error(err);
                alert('Error de conexión.');
            }
        }

        // Ejecutar por defecto al cargar la página
        window.addEventListener('DOMContentLoaded', cargarPrestamosActivos);
    </script>
</body>
</html>
