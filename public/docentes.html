<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Panol - Preceptoria</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container-fluid px-5 my-5">
        <a href="/" class="btn btn-outline-secondary mb-3">Volver al Menu Principal</a>
        <h1 class="text-center mb-4">Gestion Panol - Preceptoria</h1>

        <div>
            <h4 class="text-secondary mb-0">Lista de Docentes</h4>
            <div>
                <button type="button" class="btn btn-success me-2" data-bs-toggle="modal" data-bs-target="#modalDocente">Agregar Docente</button>

                <button type="button" class="btn btn-primary" onclick="cargarLista()">Actualizar Lista</button>
            </div>
        </div>
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th class="text-center">Nombre</th>
                                <th class="text-center">Apellido</th>
                                <th class="text-center">DNI</th>
                                <th class="text-center">Turno</th>
                                <th class="text-center">Curso</th>
                                <th class="text-center">Año</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-docentes">
                            <tr>
                                <td colspan="5" class="text-center text-muted py-4">Cargando Lista de los Docentes...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalDocente" tabindex="-1" aria-labelledby="modalDocenteLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="modalDocenteLabel">Agregar Docente a la lista</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="form-docente">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre del Docente</label>
                            <input type="text" id="docente-nombre" class="form-control">
                        </div>
                        <div>
                            <label for="apellido" class="form-label">Apellido del Docente</label>
                            <input type="text" id="docente-apellido" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label for="dni" class="form-label">DNI del Docente</label>
                            <input type="text" id="docente-dni" class="form-control">
                        </div>
                        <div class="mb-3">
                           <label class="form-label d-block">Turno/s del Docente</label>
                           <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" name="turno" id="turnoMatutino" value="Matutino">
                                <label class="form-check-label" for="turnoMatutino">Matutino</label>
                           </div>
                           <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" name="turno" id="turnoVespertino" value="Vespertino">
                                <label class="form-check-label" for="turnoVespertino">Vespertino</label>
                           </div>
                        </div>
                        <div class="mb-3">
                        <label class="form-label d-block">Curso/s del Docente</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" name="curso" id="turnoInferior" value="Inferior">
                                <label class="form-check-label" for="cursoInferior">Basico</label>
                           </div>
                           <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" name="curso" id="cursoSuperior" value="Superior">
                                <label class="form-check-label" for="cursoSuperior">Superior</label>
                           </div>
                           <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" name="curso" id="cursoTaller" value="Taller">
                                <label class="form-check-label" for="cursoTaller">Taller</label>
                           </div>
                        </div>
                        <div class="mb-3">
                        <label for="docente-anio" class="form-label">Año asignado</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" name="anios" id="1Anio" value="1">
                                <label class="form-check-label" for="1Anio">1° Año</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" name="anios" id="2Anio" value="2">
                                <label class="form-check-label" for="2Anio">2° Año</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" name="anios" id="3Anio" value="3">
                                <label class="form-check-label" for="3Anio">3° Año</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" name="anios" id="4Anio" value="4">
                                <label class="form-check-label" for="4Anio">4° Año</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" name="anios" id="5Anio" value="5">
                                <label class="form-check-label" for="5Anio">5° Año</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" name="anios" id="6Anio" value="6">
                                <label class="form-check-label" for="6Anio">6° Año</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" name="anios" id="7Anio" value="7">
                                <label class="form-check-label" for="7Anio">7° Año</label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" form="form-docente" class="btn btn-success">Guardar en Base de Datos</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_URL = 'http://localhost:3000/api/docentes';
        //1. FUNCION PARA REDIBUJAR LA TABLA ANCHA
        async function cargarLista() {
            console.log("El boton de actualizar funciona y llamo a la funcion");
            const tabla = document.getElementById('tabla-docentes');
            try {
                tabla.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">Actualizando lista... </td></tr>`;
                const respuesta = await fetch (API_URL);
                const docentes = await respuesta.json();

                tabla.innerHTML = '';

                docentes.forEach(docentes => {
                    const fila = document.createElement('tr');

                    fila.innerHTML = `
                    <td>${docentes.id}</td>
                    <td class="text-center"><strong>${docentes.nombre}</strong></td>
                    <td class="text-center"><strong>${docentes.apellido}</strong></td> 
                    <td class="text-center">${docentes.dni}</td>
                    <td class="text-center"><span>${docentes.turno}</span></td>
                    <td class="text-center"><span>${docentes.curso}</span></td>
                    <td class="text-center"><span class="badge bg-info text-dark">${docentes.anio_curso}° Año</span></td>
                    `
                    tabla.appendChild(fila);
                });

                if (docentes.length === 0) {
                    tabla.innerHTML = `<tr><td colspan="7" class+"text-center py-4">No hay docentes cargados en la lista todavia.</td></tr>`;
                    return;
                }
            }  catch (error) {
                console.error(error);
                tabla.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">Error al conectar con la API.</td></tr>`
            }
        }

        //2. LOGICA DEL FORMULARIO DENTRO DEL MODAL
        document.getElementById('form-docente').addEventListener('submit', async (e) => {
            e.preventDefault();

            const nombre = document.getElementById('docente-nombre').value;
            const apellido = document.getElementById('docente-apellido').value;
            const dni = document.getElementById('docente-dni').value.trim(); 
            const Mindigitosdni = 7;
            const Maxdigitosdni = 8;
            
            const checkboxesTurno = document.querySelectorAll('input[name="turno"]:checked');
            const turnosArray = Array.from(checkboxesTurno).map(cb => cb.value);
            const turno = turnosArray.join(', ');
            
            const checkboxesCursos = document.querySelectorAll('input[name="curso"]:checked');
            const cursosArray =Array.from(checkboxesCursos).map(cb => cb.value);
            const curso = cursosArray.join(', ');

            const checkboxesAnios = document.querySelectorAll('input[name="anios"]:checked');
            const aniosSeleccionados = Array.from(checkboxesAnios).map(cb => cb.value);
            const aniosTexto = aniosSeleccionados.join(', ');
            
            if (dni.length < Mindigitosdni) {
                alert("el DNI no puede tener menos de " + Mindigitosdni + " digitos");
                return;
            }

            if (dni.length > Maxdigitosdni) {
                alert("Los digitos DNI supero el maximo establecido (" + Maxdigitosdni + ")")
                return; 
            }

            if (turnosArray.length === 0) {
                alert("Selecciona al menos un turno para agregar al docente a la lista");
                return;
            }
            
            try {
                const respuesta = await fetch (API_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({nombre, apellido, dni, turno, curso, anio_curso: aniosSeleccionados})
                });
                
                const datosDocente = {
                nombre: nombre,
                apellido: apellido,
                dni: dni,
                turno: turno,
                curso: curso,
                anio_curso: aniosTexto // <- Acá va el texto combinado
                };
                if (respuesta.ok) {
                    alert ('Docente agregado a la lista con exito');
                    document.getElementById('form-docente').reset();

                    const modalElemento = bootstrap.Modal.getInstance(document.getElementById('modalDocente'));
                    modalElemento.hide();

                    cargarLista();
                } else {
                    const errorData = await respuesta.json();
                    alert('Error: ' + errorData.message);  
                }
            } catch (error) {
                console.error(error);
                alert('No se pudo enviar el elemento al servidor');
            }
        });

        window.addEventListener('DOMContentLoaded', cargarLista);
    </script>
</body>
</html>
